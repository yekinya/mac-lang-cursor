name: Update installers

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Update the macOS installer when its inputs or package change
        shell: bash
        run: |
          set -euo pipefail
          if ./scripts/macos-checksums.sh > "$RUNNER_TEMP/current.sha256" &&
             cmp -s "$RUNNER_TEMP/current.sha256" build/macos.sha256; then
            exit 0
          fi
          swift test
          ./scripts/build-app.sh
          git add -- build/LangCursor-macOS.dmg build/macos.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: update macOS installer"
          git push origin "HEAD:$GITHUB_REF"
